<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Mount Calculator</title>
    <style>
        @font-face {
            font-family: 'Monocraft';
            src: url("./Monocraft-Regular.woff2") format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            font-family: Monocraft, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: dark;
        }

        input {
            font-family: inherit;
        }

        input:invalid {
            border: 2px dashed red;
        }

        input:valid {
            border: 2px solid black;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: #10131a;
            color: #e6ebff;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            gap: 1rem;
        }

        .card {
            background: #171b25;
            border: 1px solid #2a3042;
            border-radius: 12px;
            padding: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 0.35rem;
        }

        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #3a4259;
            border-radius: 6px;
            background: #0f1421;
            color: inherit;
            padding: 0.35rem 0.45rem;
        }

        input[type="range"] {
            width: 100%;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            background: #4f7dff;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        #status {
            margin-top: 0.25rem;
            font-size: 0.95rem;
            color: #a6b4d8;
        }

        ul {
            margin: 0.35rem 0 0;
            padding-left: 1.3rem;
        }

        .ingredient-sprite {
            background: url("ProfessionIcon.webp");
            display: inline-block;
            height: 32px;
            width: 32px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Wynncraft Mount Ingredient Calculator</h1>

        <form id="mount-form" class="card">
            <h2>Mount Info</h2>

            <p>Enter current stat levels, cap limits, and target max levels.</p>

            <table>
                <thead>
                    <tr>
                        <th>Stat</th>
                        <th>Current</th>
                        <th>Limit</th>
                        <th>Max</th>
                    </tr>
                </thead>

                <tbody id="stats-table-body">
                    <tr>
                        <td>Speed</td>
                        <td>
                            <input name="current-0" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-0" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-0" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Acceleration</td>
                        <td>
                            <input name="current-1" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-1" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-1" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Altitude</td>
                        <td>
                            <input name="current-2" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-2" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-2" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Energy</td>
                        <td>
                            <input name="current-3" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-3" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-3" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Handling</td>
                        <td>
                            <input name="current-4" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-4" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-4" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Toughness</td>
                        <td>
                            <input name="current-5" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-5" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-5" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Boost</td>
                        <td>
                            <input name="current-6" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-6" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-6" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                    <tr>
                        <td>Training</td>
                        <td>
                            <input name="current-7" type="number" min="1" max="300" inputmode="numeric" placeholder="1"
                                required>
                        </td>
                        <td>
                            <input name="limit-7" type="number" min="1" max="300" inputmode="numeric" placeholder="10"
                                required>
                        </td>
                        <td>
                            <input name="max-7" type="number" min="1" max="300" inputmode="numeric" placeholder="30"
                                required>
                        </td>
                    </tr>
                </tbody>
            </table>

            <h3>Options</h3>

            <label for="time-importance">Time importance: <strong id="time-importance-value">0.50</strong></label>
            <input id="time-importance" name="timeImportance" type="range" min="0" max="1" value="0.5" step="0.01">

            <div class="row" style="margin-top:0.8rem;">
                <label for="time-limit-seconds">Solver time limit (seconds)</label>
                <input id="time-limit-seconds" name="timeLimitSeconds" type="number" min="1" value="3" required>
            </div>

            <div style="margin-top:1rem;">
                <button type="submit">Calculate Ingredients</button>
            </div>
        </form>

        <section class="card" id="results">
            <h2>Results</h2>
            <div>Total runtime: <strong id="runtime">-</strong></div>
            <div>Solution status: <strong id="solution-status">-</strong></div>
            <div>Total cost: <strong id="total-cost">-</strong></div>
            <div id="status"></div>

            <h3>All Ingredients</h3>
            <ul id="ingredients-list"></ul>
        </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "glpk.js": "https://esm.sh/glpk.js@5.0.0"
        }
      }
    </script>

    <script type="module">
        import {
            parseSearchParams,
            assert,
            updateSearchParams,
            validateForm,
            range,
            calculateIngredients,
            AbortedCalculationError,
            itemSpriteSheetCoords,
        } from './index.js';

        const url = new URL(window.location.href);
        const formValues = parseSearchParams(url.searchParams);

        const form = document.querySelector("#mount-form");
        assert(form, "Form element not found");

        for (const {name, value} of formValues) {
            const input = form.querySelector(`input[name="${name}"]`);
            assert(input, `Input with name "${name}" not found`);
            input.value = value;
        }

        const timeImportanceSlider = form.querySelector("#time-importance");
        const timeImportanceValue = form.querySelector("#time-importance-value");
        const ingredientsList = document.querySelector("#ingredients-list");

        timeImportanceSlider.addEventListener("input", (event) => {
            const value = event.target.value;
            timeImportanceValue.textContent = value;
        });

        form.addEventListener("change", (event) => {
            const formData = new FormData(form);
            updateSearchParams(url.searchParams, formData);
            window.history.pushState({}, "", url);
            validateForm(form);
        });

        let formAC = new AbortController();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const formData = new FormData(form);

            formAC.abort();
            formAC = new AbortController();

            const current = range(8)
                .map(i => Number(formData.get(`current-${i}`), 10));
            const limit = range(8)
                .map(i => Number(formData.get(`limit-${i}`), 10));
            const max = range(8)
                .map(i => Number(formData.get(`max-${i}`), 10));

            const mountInfo = {current, limit, max};
            const timeImportance = Number(formData.get("timeImportance"));
            const timeLimitSeconds = Number(formData.get("timeLimitSeconds"));

            let result;
            try {
                result = await calculateIngredients(
                    mountInfo,
                    {timeImportance, timeLimitSeconds, signal: formAC.signal}
                );
            } catch (err) {
                if (err instanceof AbortedCalculationError) {
                    console.log("Calculation aborted");
                    return;
                }
                throw err;
            }

            const {time, status, totalCost, ingredients} = result;

            ingredientsList.innerHTML = "";
            for (const {ingIdx, ingredient, quantity} of ingredients) {
                const li = document.createElement("li");

                const imgDiv = document.createElement("div");
                const [spriteX, spriteY] = itemSpriteSheetCoords(ingIdx);
                imgDiv.classList.add('ingredient-sprite');
                imgDiv.style.backgroundPosition = `-${spriteX}px -${spriteY}px`;
                li.appendChild(imgDiv);

                const textSpan = document.createElement("span");
                textSpan.textContent = `${quantity}x ${ingredient.name} (Level ${ingredient.level})`;
                li.appendChild(textSpan);

                ingredientsList.appendChild(li);
            }
        });
    </script>
</body>

</html>
