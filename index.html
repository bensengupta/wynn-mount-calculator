<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Mount Calculator</title>
    <style>
        @font-face {
            font-family: 'Monocraft';
            src: url("./Monocraft-Regular.woff2") format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Monocraft';
            src: url("./Monocraft-SemiBold.woff2") format('woff2');
            font-weight: 600;
            font-style: normal;
        }

        :root {
            font-family: Monocraft, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: dark;

            --primary: #00CA4A;
            --text: #FCFCFC;
            --accent: #A8A8A8;
            --bg: #202020;

            --current-level: #AAF7C4;
            /* nice */
            --max-level-heading: #676767;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* Reset heading tags */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            margin: 0;
            display: inline-block;
        }

        ul {
            list-style-type: none;
            padding: 0px;
            margin: 0px;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: black;
            color: var(--text);
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 80rem;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: start;

            @media (width >=64rem) {
                grid-template-columns: fit-content(25rem) 1fr;
            }
        }

        input {
            color: var(--text);
            font-family: inherit;

            &[type="number"] {
                border: none;
                border-radius: 6px;
                font-size: inherit;
                padding: 0.1rem 0.25rem;
                background-color: black;
            }

            &::placeholder {
                color: var(--text);
                opacity: 0.5;
            }
        }

        .card {
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #stats-grid {
            display: grid;
            grid-template-columns: minmax(8rem, 10rem) repeat(3, fit-content(100%));
            align-items: center;
            gap: 0.25rem 0.1rem;

            /* Header column */
            &>span:nth-child(4n + 1) {
                color: white;
            }

            /* Current column */
            &>span:nth-child(4n + 2) {
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: end;

                &>input {
                    color: var(--current-level);
                    text-align: end;
                }
            }

            /* Limit column */
            &>span:nth-child(4n + 3) {
                color: var(--accent);
                display: flex;
                align-items: center;
            }

            /* Max column */
            &>span:nth-child(4n + 4) {
                padding-left: 0.25rem;
                color: var(--max-level-heading);
                display: flex;
                align-items: center;
            }


            /* ----- Remove up/down arrows from input[type="number"] ----- */
            /* Chrome, Safari, Edge, Opera */
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            input[type="number"] {
                /* Firefox */
                -moz-appearance: textfield;
                appearance: textfield;
                width: 2.5rem;
            }
        }

        summary {
            margin: -0.5em -0.5em 0;
            padding: 0.5em;
        }

        input[type="range"] {
            width: 100%;
        }

        input[type="number"] {
            max-width: 5rem;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            background: #4f7dff;
            background: var(--primary);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0px 5px 0px 0px rgba(from var(--primary) r g b / 0.3);

            &:active {
                box-shadow: 0px 2px 0px 0px rgba(from var(--primary) r g b / 0.3);
                transform: translateY(3px);
            }
        }

        .form-col:not(:first-child) {
            margin-top: 0.5rem;
        }

        .form-col {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ingredient-sprite {
            background: url("ProfessionIcon.webp");
            display: inline-block;
            height: 32px;
            width: 32px;
        }

        #status {
            font-size: 0.75rem;
            color: var(--accent);
            cursor: help;
        }

        .ingredient-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ingredients-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>

<body>
    <main>
        <h2>Wynncraft Mount Ingredient Calculator</h2>

        <div class="grid">
            <form id="mount-form" class="card">
                <div id="stats-grid">
                    <span></span>
                    <span>Level</span>
                    <span><span aria-hidden="true">/</span>Limit</span>
                    <span>
                        <span aria-hidden="true">(</span>Max<span aria-hidden="true">)</span>
                    </span>

                    <span>Speed</span>
                    <span>
                        <input name="current-0" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-0" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-0" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Acceleration</span>
                    <span>
                        <input name="current-1" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-1" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-1" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Altitude</span>
                    <span>
                        <input name="current-2" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-2" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-2" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Energy</span>
                    <span>
                        <input name="current-3" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-3" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-3" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Handling</span>
                    <span>
                        <input name="current-4" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-4" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-4" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Toughness</span>
                    <span>
                        <input name="current-5" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-5" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-5" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Boost</span>
                    <span>
                        <input name="current-6" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-6" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-6" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>

                    <span>Training</span>
                    <span>
                        <input name="current-7" type="number" min="1" max="300" placeholder="1" required>
                    </span>
                    <span>
                        /
                        <input name="limit-7" type="number" min="1" max="300" placeholder="10" required>
                    </span>
                    <span>
                        (
                        <input name="max-7" type="number" min="1" max="300" placeholder="30" required>
                        )
                    </span>
                </div>

                <details>
                    <summary>
                        <h3>Options</h3>
                    </summary>

                    <div class="form-col">
                        <label for="time-importance">Time importance: <strong
                                id="time-importance-value">0.50</strong></label>
                        <input id="time-importance" name="timeImportance" type="range" min="0" max="1" value="0.5"
                            step="0.01">
                    </div>

                    <div class="form-col">
                        <label for="time-limit-seconds">Solver time limit (seconds)</label>
                        <input id="time-limit-seconds" name="timeLimitSeconds" type="number" min="1" required>
                    </div>
                </details>

                <button type="submit">Calculate Ingredients</button>
            </form>

            <section class="card">
                <h3 class="ingredients-header">
                    Ingredients<span id="status"></span>
                </h3>

                <ul id="ingredients-list"></ul>
            </section>
        </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "glpk.js": "https://esm.sh/glpk.js@5.0.0"
        }
      }
    </script>

    <script type="module">
        import {
            parseSearchParams,
            assert,
            updateSearchParams,
            validateForm,
            range,
            calculateIngredients,
            AbortedCalculationError,
            itemSpriteSheetCoords,
        } from './index.js';

        const url = new URL(window.location.href);
        const formValues = parseSearchParams(url.searchParams);

        const form = document.querySelector("#mount-form");
        assert(form, "Form element not found");

        for (const {name, value} of formValues) {
            const input = form.querySelector(`input[name="${name}"]`);
            assert(input, `Input with name "${name}" not found`);
            input.value = value;
        }

        const timeImportanceSlider = form.querySelector("#time-importance");
        const timeImportanceValue = form.querySelector("#time-importance-value");
        const ingredientsList = document.querySelector("#ingredients-list");
        const statusSpan = document.querySelector("#status");

        timeImportanceValue.textContent = timeImportanceSlider.value;
        timeImportanceSlider.addEventListener("input", (event) => {
            const value = event.target.value;
            timeImportanceValue.textContent = value;
        });

        form.addEventListener("change", (event) => {
            const formData = new FormData(form);
            updateSearchParams(url.searchParams, formData);
            window.history.pushState({}, "", url);
            validateForm(form);
        });

        let formAC = new AbortController();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const formData = new FormData(form);

            formAC.abort();
            formAC = new AbortController();

            const current = range(8)
                .map(i => Number(formData.get(`current-${i}`), 10));
            const limit = range(8)
                .map(i => Number(formData.get(`limit-${i}`), 10));
            const max = range(8)
                .map(i => Number(formData.get(`max-${i}`), 10));

            const mountInfo = {current, limit, max};
            const timeImportance = Number(formData.get("timeImportance"));
            const timeLimitSeconds = Number(formData.get("timeLimitSeconds"));

            statusSpan.textContent = "◔";
            statusSpan.title = "Calculating..."

            let result;
            try {
                result = await calculateIngredients(
                    mountInfo,
                    {timeImportance, timeLimitSeconds, signal: formAC.signal}
                );
            } catch (err) {
                if (err instanceof AbortedCalculationError) {
                    console.log("Calculation aborted");
                    return;
                }
                throw err;
            }

            const {time, status, totalCost, totalQuantity, ingredients} = result;

            const timeMs = Math.floor(time * 1000);
            statusSpan.textContent = `${status.substring(0, 2)} ${timeMs}ms`;
            statusSpan.title = status.substring(2);

            ingredientsList.innerHTML = "";

            const totalQuantityListItem = document.createElement("li");
            totalQuantityListItem.textContent = `Total Ingredients: ${totalQuantity}`;
            totalQuantityListItem.style.fontWeight = "600";
            ingredientsList.appendChild(totalQuantityListItem);

            for (const {ingIdx, ingredient, quantity} of ingredients) {
                const li = document.createElement("li");
                li.classList.add("ingredient-row");

                const quantitySpan = document.createElement("span");
                quantitySpan.textContent = `${quantity} x`;
                li.appendChild(quantitySpan);

                const imgDiv = document.createElement("div");
                const [spriteX, spriteY] = itemSpriteSheetCoords(ingIdx);
                imgDiv.classList.add('ingredient-sprite');
                imgDiv.style.backgroundPosition = `-${spriteX}px -${spriteY}px`;
                li.appendChild(imgDiv);

                const textSpan = document.createElement("span");
                textSpan.textContent = `${ingredient.name} (Level ${ingredient.level})`;
                li.appendChild(textSpan);

                ingredientsList.appendChild(li);
            }
        });

        form.requestSubmit();
    </script>
</body>

</html>
